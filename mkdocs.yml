site_name: Plataforma de Energias Renováveis - TOPSIS
site_description: Documentação e Manual do Usuário da API e Dashboard
site_author: Equipe do Projeto

theme:
  name: material
  language: pt
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
  features:
    - navigation.expand
    - navigation.top
    - content.code.copy

plugins:
  - search

nav:
  - Manual do Usuário: index.md